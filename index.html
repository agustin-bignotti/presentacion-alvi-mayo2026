<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Score × Alvi · 2026</title>
  <link rel="icon" type="image/png" href="assets/Logos e Isotipos/Isotipo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; min-height: 100vh;
      background: #080808; color: #fff;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 24px;
      text-align: center;
      gap: 28px;
    }
    .logo { width: min(420px, 70vw); filter: drop-shadow(0 0 30px rgba(244,255,0,0.25)); }
    h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(32px, 5vw, 54px);
      letter-spacing: 0.08em;
      color: #F4FF00;
      margin: 0;
      text-shadow: 0 0 40px rgba(244,255,0,0.3);
    }
    p {
      color: #AAAAAA;
      font-size: 14px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin: 0;
    }
    .cta {
      display: inline-block;
      margin-top: 12px;
      background: #F4FF00; color: #000;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 16px 40px;
      border-radius: 8px;
      font-size: 14px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(244,255,0,0.35);
    }
    @media (max-width: 768px) {
      .wrap { gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/Logos e Isotipos/Logo SCORE Extendido (sin fondo).png" alt="Score Energy Drink">
    <h1>Score × Alvi · 2026</h1>
    <p>Mayo 2026</p>
    <a class="cta" href="brands/score-alvi/">Iniciar presentación &rarr;</a>
  </div>
</body>
</html>
